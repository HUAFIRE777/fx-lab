<!DOCTYPE html>
<!-- huafire3d fx-lab — original implementation -->
<!-- pricing-3d: 3D tilt pricing cards / monthly-annual toggle / odometer prices -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driftline — Pricing</title>
<meta name="description" content="Simple pricing that grows with you. Start free, upgrade when the graphs get steep.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="bg" aria-hidden="true"></div>

<header class="nav">
  <div class="wrap nav-in">
    <a class="logo" href="#"><span class="logo-dot"></span>Driftline</a>
    <nav class="nav-links">
      <a href="#">Product</a><a href="#">Docs</a><a href="#" class="is-here">Pricing</a>
    </nav>
    <a class="nav-cta" href="#">Sign in</a>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <p class="eyebrow rise" style="--d:.05s">Pricing</p>
    <h1 class="rise" style="--d:.12s">Pay for growth,<br>not seats.</h1>
    <p class="sub rise" style="--d:.2s">Start free, upgrade when the graphs get steep. Every plan opens with a
      14-day Pro trial — no credit card required.</p>
    <div class="billing rise" style="--d:.28s" role="group" aria-label="Billing period">
      <span class="b-thumb" aria-hidden="true"></span>
      <button class="b-opt is-on" data-b="m" aria-pressed="true">Monthly</button>
      <button class="b-opt" data-b="a" aria-pressed="false">Annual <em>−20%</em></button>
    </div>
  </section>

  <section class="cards" id="cards" aria-label="Plans"></section>

  <p class="fine rise" style="--d:.5s">All plans include unlimited viewers, SOC&nbsp;2 Type&nbsp;II,
    and 99.99% uptime. Prices in USD, taxes may apply.</p>
</main>

<script type="module" src="src/main.js"></script>
</body>
</html>
