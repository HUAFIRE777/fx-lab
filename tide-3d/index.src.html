<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>潮汐涨落 · tide-3d — huafire3d fx-lab</title>
<style>
:root{
  --bg:#06121f; --deep:#0a1c30; --ink:#dce9f5; --dim:#8ba3bd; --faint:#5b7189;
  --line:rgba(220,233,245,.14); --glass:rgba(8,18,32,.58);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
#scene{position:fixed; inset:0; width:100%; height:100%; display:block}

/* ---- 暗角 + 噪点（手工细节） ---- */
.vignette{position:fixed; inset:0; z-index:2; pointer-events:none;
  background:radial-gradient(ellipse at 50% 42%, transparent 52%, rgba(2,7,13,.62) 100%)}
.grain{position:fixed; inset:0; z-index:3; pointer-events:none; opacity:.055; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='0.55'/></svg>")}

/* ---- 加载态 ---- */
#loader{position:fixed; inset:0; z-index:50; background:var(--bg);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  transition:opacity .9s var(--ease)}
html.js #loader{opacity:0; pointer-events:none}
.l-kicker{font-size:11px; letter-spacing:.5em; color:var(--faint); text-indent:.5em}
.l-title{font-family:"Songti SC","STSong","Noto Serif SC",serif; font-size:64px; letter-spacing:.28em; text-indent:.28em; color:var(--ink)}
.l-sub{font-size:13px; color:var(--dim); letter-spacing:.2em}
.l-bar{width:180px; height:2px; background:rgba(220,233,245,.12); border-radius:2px; overflow:hidden}
.l-bar i{display:block; height:100%; width:30%; border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--ink),transparent);
  animation:barslide 1.4s var(--ease) infinite}
@keyframes barslide{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}

/* ---- 入场（完成态选择器带 html.js 前缀） ---- */
.hero,.tidebadge,.panel,.foot{opacity:0; transform:translateY(14px)}
html.js .hero{opacity:1; transform:none; transition:opacity 1.1s var(--ease) .15s, transform 1.1s var(--ease) .15s}
html.js .tidebadge{opacity:1; transform:none; transition:opacity 1.1s var(--ease) .35s, transform 1.1s var(--ease) .35s}
html.js .panel{opacity:1; transform:none; transition:opacity 1.1s var(--ease) .5s, transform 1.1s var(--ease) .5s}
html.js .foot{opacity:1; transform:none; transition:opacity 1.1s var(--ease) .7s}

/* ---- 标题区 ---- */
.hero{position:fixed; z-index:5; top:34px; left:38px; max-width:430px; pointer-events:none}
.kicker{font-size:11px; letter-spacing:.42em; color:var(--dim); margin-bottom:14px}
.hero h1{font-family:"Songti SC","STSong","Noto Serif SC",serif; font-weight:600;
  font-size:clamp(38px,5.4vw,68px); letter-spacing:.14em; margin:0 0 14px; line-height:1.15;
  text-shadow:0 2px 30px rgba(6,18,31,.8)}
.hero .sub{font-size:14px; line-height:2; color:var(--dim); margin:0 0 22px; letter-spacing:.06em}
.stats{display:flex; gap:26px; pointer-events:auto}
.stat{display:flex; flex-direction:column; gap:7px}
.stat .k{font-size:10px; letter-spacing:.34em; color:var(--faint)}
.stat .v{font-size:19px; letter-spacing:.08em; color:var(--ink); font-variant-numeric:tabular-nums; white-space:nowrap}

/* ---- 右上徽标 ---- */
.tidebadge{position:fixed; z-index:5; top:38px; right:38px;
  display:flex; align-items:center; gap:10px; padding:10px 18px;
  border:1px solid var(--line); border-radius:999px; background:var(--glass);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  font-size:13px; letter-spacing:.22em; color:var(--ink)}
.tidebadge .dot{width:7px; height:7px; border-radius:50%; background:var(--ink);
  box-shadow:0 0 10px var(--ink); animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ---- 控制面板 ---- */
.panel{position:fixed; z-index:5; left:38px; bottom:32px; width:392px;
  background:var(--glass); border:1px solid var(--line); border-radius:18px;
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  padding:20px 22px 16px; box-shadow:0 18px 50px rgba(0,0,0,.45)}
.row{margin-bottom:16px}
.row:last-child{margin-bottom:0}
.cap{font-size:11px; letter-spacing:.3em; color:var(--dim); margin-bottom:10px; display:flex; justify-content:space-between; align-items:baseline}
.cap b{color:var(--ink); font-weight:600; letter-spacing:.1em; font-variant-numeric:tabular-nums}
.moonrow{display:grid; grid-template-columns:repeat(8,1fr); gap:2px}
.moon{background:none; border:0; padding:6px 0 4px; cursor:pointer; border-radius:10px;
  display:flex; flex-direction:column; align-items:center; gap:5px;
  transition:background .35s var(--ease), transform .35s var(--ease)}
.moon:hover{background:rgba(220,233,245,.07); transform:translateY(-2px)}
.moon svg{width:26px; height:26px; display:block; filter:drop-shadow(0 0 6px rgba(220,233,245,.25))}
.moon span{font-size:10px; letter-spacing:.12em; color:var(--faint); transition:color .3s}
.moon:hover span{color:var(--dim)}
.moon.sel{background:rgba(220,233,245,.1)}
.moon.sel span{color:var(--ink)}
.moon.sel svg{filter:drop-shadow(0 0 9px rgba(220,233,245,.65))}

input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:22px; background:transparent; cursor:pointer; margin:0}
input[type=range]::-webkit-slider-runnable-track{height:3px; border-radius:3px;
  background:linear-gradient(90deg, rgba(220,233,245,.55), rgba(220,233,245,.14))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:17px; height:17px; margin-top:-7px;
  border-radius:50%; background:var(--ink); border:2px solid #0a1a2c;
  box-shadow:0 0 12px rgba(220,233,245,.55); transition:transform .3s var(--ease)}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.25)}
input[type=range]::-moz-range-track{height:3px; border-radius:3px; background:rgba(220,233,245,.25)}
input[type=range]::-moz-range-thumb{width:14px; height:14px; border-radius:50%; background:var(--ink); border:2px solid #0a1a2c}

.btns{display:flex; gap:10px}
.btn{flex:1; padding:11px 0; border-radius:12px; cursor:pointer;
  border:1px solid var(--line); background:rgba(220,233,245,.06); color:var(--ink);
  font-size:13px; letter-spacing:.18em; text-indent:.18em;
  font-family:inherit; transition:transform .35s var(--ease), box-shadow .35s var(--ease), background .35s}
.btn:hover{transform:translateY(-2px); background:rgba(220,233,245,.12);
  box-shadow:0 8px 22px rgba(220,233,245,.14)}
.btn:active{transform:translateY(0)}
.btn.ghost{flex:.62; background:transparent; color:var(--dim)}
.btn.ghost:hover{color:var(--ink)}
.btn.live{border-color:rgba(220,233,245,.5); box-shadow:0 0 16px rgba(220,233,245,.2) inset}
.note{font-size:11.5px; line-height:1.9; color:var(--faint); letter-spacing:.05em; margin:14px 0 0}

.foot{position:fixed; z-index:5; right:38px; bottom:36px; font-size:11px; letter-spacing:.24em; color:var(--faint)}

@media (max-width:640px){
  .hero{top:20px; left:20px; right:20px; max-width:none}
  .hero .sub{display:none}
  .stats{gap:16px}
  .stat .v{font-size:16px}
  .tidebadge{top:20px; right:20px; padding:8px 14px; font-size:12px}
  .panel{left:12px; right:12px; bottom:12px; width:auto; padding:16px 16px 12px}
  .moon svg{width:22px; height:22px}
  .note{display:none}
  .foot{display:none}
}
@media (prefers-reduced-motion:reduce){
  .tidebadge .dot{animation:none}
  .l-bar i{animation-duration:3s}
}
</style>
</head>
<body>
<div id="loader" aria-hidden="true">
  <div class="l-kicker">TIDE · MOON PHASE</div>
  <div class="l-title">潮汐</div>
  <div class="l-sub">潮汐酝酿中</div>
  <div class="l-bar"><i></i></div>
</div>

<canvas id="scene"></canvas>
<div class="vignette"></div>
<div class="grain"></div>

<header class="hero">
  <div class="kicker">TIDE · 月相联动</div>
  <h1>潮汐涨落</h1>
  <p class="sub">月亮把海水往上拽，岸就往后退一步。<br>朔望涨得猛，上下弦温柔些。</p>
  <div class="stats">
    <div class="stat"><span class="k">水位</span><span class="v" id="stLevel">+0.0 m</span></div>
    <div class="stat"><span class="k">潮汐</span><span class="v" id="stDir">退潮中</span></div>
    <div class="stat"><span class="k">潮差</span><span class="v" id="stRange">4.8 m</span></div>
    <div class="stat"><span class="k">月相</span><span class="v" id="stPhase">望 · 大潮</span></div>
  </div>
</header>

<div class="tidebadge"><span class="dot"></span><span id="badgeTxt">望 · 大潮</span></div>

<section class="panel" aria-label="潮汐控制台">
  <div class="row">
    <div class="cap"><span>月相</span><b id="phaseName">望</b></div>
    <div class="moonrow" id="moonRow">
      <button class="moon" data-i="0" aria-label="朔">
        <svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="9.5" fill="none" stroke="#8ba3bd" stroke-width="1.6"/></svg><span>朔</span></button>
      <button class="moon" data-i="1" aria-label="娥眉月">
        <svg viewBox="0 0 28 28"><defs><mask id="ph1"><rect width="28" height="28" fill="#fff"/><circle cx="19" cy="14" r="9.5" fill="#000"/></mask></defs><circle cx="14" cy="14" r="9.5" fill="#dce9f5" mask="url(#ph1)"/></svg><span>娥眉</span></button>
      <button class="moon" data-i="2" aria-label="上弦月">
        <svg viewBox="0 0 28 28"><defs><mask id="ph2"><rect width="28" height="28" fill="#fff"/><rect x="0" y="0" width="14" height="28" fill="#000"/></mask></defs><circle cx="14" cy="14" r="9.5" fill="#dce9f5" mask="url(#ph2)"/></svg><span>上弦</span></button>
      <button class="moon" data-i="3" aria-label="盈凸月">
        <svg viewBox="0 0 28 28"><defs><mask id="ph3"><rect width="28" height="28" fill="#fff"/><ellipse cx="6.5" cy="14" rx="6" ry="9.5" fill="#000"/></mask></defs><circle cx="14" cy="14" r="9.5" fill="#dce9f5" mask="url(#ph3)"/></svg><span>盈凸</span></button>
      <button class="moon sel" data-i="4" aria-label="望">
        <svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="9.5" fill="#dce9f5"/></svg><span>望</span></button>
      <button class="moon" data-i="5" aria-label="亏凸月">
        <svg viewBox="0 0 28 28"><defs><mask id="ph5"><rect width="28" height="28" fill="#fff"/><ellipse cx="21.5" cy="14" rx="6" ry="9.5" fill="#000"/></mask></defs><circle cx="14" cy="14" r="9.5" fill="#dce9f5" mask="url(#ph5)"/></svg><span>亏凸</span></button>
      <button class="moon" data-i="6" aria-label="下弦月">
        <svg viewBox="0 0 28 28"><defs><mask id="ph6"><rect width="28" height="28" fill="#fff"/><rect x="14" y="0" width="14" height="28" fill="#000"/></mask></defs><circle cx="14" cy="14" r="9.5" fill="#dce9f5" mask="url(#ph6)"/></svg><span>下弦</span></button>
      <button class="moon" data-i="7" aria-label="残月">
        <svg viewBox="0 0 28 28"><defs><mask id="ph7"><rect width="28" height="28" fill="#fff"/><circle cx="9" cy="14" r="9.5" fill="#000"/></mask></defs><circle cx="14" cy="14" r="9.5" fill="#dce9f5" mask="url(#ph7)"/></svg><span>残月</span></button>
    </div>
  </div>
  <div class="row">
    <div class="cap"><span>时间加速</span><b id="speedVal">×240</b></div>
    <input id="speed" type="range" min="0" max="1000" value="793" aria-label="时间加速">
  </div>
  <div class="row btns">
    <button id="demoFlood" class="btn">看一次涨潮</button>
    <button id="demoEbb" class="btn">看一次退潮</button>
    <button id="pauseBtn" class="btn ghost">暂停</button>
  </div>
  <p class="note">朔和望是「大潮」，潮差最大；上弦和下弦是「小潮」，潮差最小。时间加速只加快潮汐，浪还是原来的浪。</p>
</section>

<div class="foot">huafire3d fx-lab · tide-3d</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
