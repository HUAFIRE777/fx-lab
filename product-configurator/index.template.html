<!DOCTYPE html>
<!-- huafire3d fx-lab — original implementation -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>3D 产品配置器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f7cff'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="src/style.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js"
  }
}
</script>
</head>
<body>
<div id="app">
  <!-- 左：3D 展台 -->
  <section id="stage" aria-label="产品 3D 预览">
    <div id="vignette"></div>
    <div id="grain"></div>
    <div id="wordmark" aria-hidden="true"></div>
    <div id="loader" role="status" aria-live="polite">
      <div class="load-kicker">LOADING 3D MODEL</div>
      <div id="loadbar"><i></i></div>
      <div id="loadtext">准备中…</div>
    </div>
    <div id="errorbox" role="alert">
      <svg class="ph" width="72" height="72" viewBox="0 0 72 72" fill="none">
        <circle cx="36" cy="36" r="34" stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-dasharray="6 6"/>
        <path d="M24 44 L34 34 M34 34 L48 48 M34 34 L28 28 M44 24 L48 28 L44 32" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <p>3D 模型加载失败，请检查网络后重试。<br>您可以继续浏览配置选项。</p>
      <button id="retry" type="button">重新加载模型</button>
    </div>
    <div id="hint">拖拽旋转 · 滚轮缩放 · 双指缩放</div>
    <div id="modelcredit"></div>
  </section>

  <!-- 右：配置面板（移动端变底部抽屉） -->
  <aside id="panel" aria-label="产品配置">
    <button id="drawer-handle" aria-label="展开 / 收起配置面板"></button>
    <div class="pd-kicker">3D CONFIGURATOR</div>
    <h1 class="pd-name" id="pd-name"></h1>
    <p class="pd-tagline" id="pd-tagline"></p>

    <div class="pd-price-row">
      <div id="price">¥0</div>
      <span class="pd-price-note">含税 · 顺丰包邮</span>
    </div>
    <div id="delta-line"></div>

    <div id="opt-groups"></div>

    <button id="cta" type="button"></button>

    <ul class="pd-features" id="pd-features"></ul>
  </aside>
</div>

<div id="toast" role="status"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
