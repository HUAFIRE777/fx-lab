<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>流体 · FLUID — GPGPU 粒子流体</title>
<style>
  :root{
    --deep:#04121F;
    --aqua:#38E1C6;
    --foam:#F4FBFA;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--deep)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    color:var(--foam);user-select:none;-webkit-user-select:none;
  }
  #stage{position:fixed;inset:0}
  #stage canvas{display:block;width:100%;height:100%}
  .vignette{
    position:fixed;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(ellipse at 50% 42%, transparent 52%, rgba(2,8,14,.55) 100%);
  }
  .hud{position:fixed;z-index:5;pointer-events:none}
  header.hud{top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:28px 34px}
  .title{opacity:0;transform:translateY(14px);animation:rise .9s var(--ease) .25s forwards}
  .title h1{font-size:30px;font-weight:700;letter-spacing:.14em}
  .title h1 .latin{font-size:15px;font-weight:400;letter-spacing:.42em;color:var(--aqua);margin-left:10px;vertical-align:3px}
  .title p{margin-top:8px;font-size:13px;letter-spacing:.28em;color:rgba(244,251,250,.62)}
  @keyframes rise{to{opacity:1;transform:none}}
  .modes{position:fixed;z-index:6;top:30px;right:34px;display:flex;gap:10px;opacity:0;animation:rise .9s var(--ease) .45s forwards}
  .mode-btn{
    pointer-events:auto;cursor:pointer;border:1px solid rgba(56,225,198,.28);
    background:rgba(4,18,31,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    color:var(--foam);border-radius:999px;padding:9px 18px 8px;
    font-size:14px;letter-spacing:.2em;text-indent:.2em;
    display:flex;align-items:center;gap:8px;
    transition:transform .28s var(--ease),border-color .28s,background .28s,box-shadow .28s;
  }
  .mode-btn .en{font-size:9px;letter-spacing:.3em;color:rgba(56,225,198,.75);text-indent:0}
  .mode-btn:hover{transform:translateY(-2px) scale(1.04);border-color:rgba(56,225,198,.8);box-shadow:0 6px 22px rgba(56,225,198,.18)}
  .mode-btn:active{transform:translateY(0) scale(.97);transition-duration:.12s}
  .mode-btn.active{background:rgba(56,225,198,.16);border-color:var(--aqua);box-shadow:0 0 18px rgba(56,225,198,.25)}
  footer.hud{bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;padding:24px 34px}
  footer .stat{font-size:11px;letter-spacing:.3em;color:rgba(244,251,250,.5);opacity:0;animation:rise .9s var(--ease) .6s forwards}
  footer .hint{font-size:11px;letter-spacing:.24em;color:rgba(56,225,198,.6);opacity:0;animation:rise .9s var(--ease) .75s forwards}
  #loader{
    position:fixed;inset:0;z-index:20;background:var(--deep);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    transition:opacity .7s var(--ease);
  }
  #loader.done{opacity:0;pointer-events:none}
  #loader .t{font-size:14px;letter-spacing:.5em;text-indent:.5em;color:var(--foam)}
  #loader .bar{width:180px;height:2px;background:rgba(56,225,198,.15);border-radius:2px;overflow:hidden}
  #loader .bar i{display:block;height:100%;width:40%;background:var(--aqua);border-radius:2px;animation:scan 1.1s ease-in-out infinite}
  @keyframes scan{0%{transform:translateX(-100%)}100%{transform:translateX(450%)}}
  #fallback[hidden]{display:none}
  #fallback{
    position:fixed;inset:0;z-index:15;
    background:
      radial-gradient(ellipse 90% 70% at 50% 110%, rgba(56,225,198,.22), transparent 60%),
      radial-gradient(ellipse 70% 55% at 50% -10%, rgba(20,90,110,.5), transparent 65%),
      linear-gradient(180deg,#06283a 0%,#04121F 70%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:0 32px;
  }
  #fallback h1{font-size:26px;letter-spacing:.2em}
  #fallback p{font-size:13px;letter-spacing:.24em;color:rgba(244,251,250,.6);line-height:2.2}
  #fallback .tag{font-size:11px;letter-spacing:.3em;color:var(--aqua)}
  @media (max-width:700px){
    header.hud{padding:20px 20px}
    .title h1{font-size:22px}
    .title p{font-size:11px}
    .modes{top:auto;bottom:76px;right:0;left:0;justify-content:center}
    .mode-btn{padding:8px 14px 7px;font-size:13px}
    footer.hud{padding:18px 20px;flex-direction:column;align-items:center;gap:8px}
  }
  @media (prefers-reduced-motion:reduce){
    .title,.modes,footer .stat,footer .hint{animation-duration:.01s}
  }
</style>
<script type="importmap">
{"imports":{"three":"vendor/three.module.js"}}
</script>
</head>
<body>
<div id="stage"></div>
<div class="vignette"></div>

<header class="hud">
  <div class="title">
    <h1>流体<span class="latin">FLUID</span></h1>
    <p>指尖所至，皆起涟漪</p>
  </div>
</header>

<nav class="modes" id="modes">
  <button class="mode-btn active" data-mode="0"><span>水</span><span class="en">WATER</span></button>
  <button class="mode-btn" data-mode="1"><span>烟</span><span class="en">SMOKE</span></button>
  <button class="mode-btn" data-mode="2"><span>星尘</span><span class="en">STARDUST</span></button>
</nav>

<footer class="hud">
  <div class="stat" id="stat">20 万粒子 · 全 GPU 计算</div>
  <div class="hint">移动搅动流体 · 点击释放爆发</div>
</footer>

<div id="loader">
  <div class="t">正在唤醒粒子</div>
  <div class="bar"><i></i></div>
</div>

<div id="fallback" hidden>
  <div class="tag">FLUID</div>
  <h1>流体</h1>
  <p>当前设备不支持 WebGL 浮点计算<br>粒子流体需要 GPU 才能苏醒<br>换一台设备，再来看海</p>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
